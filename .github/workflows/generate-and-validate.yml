name: Generate Working Playlist

on:
  schedule:
    - cron: "0 3 * * *"      # every day at 03:00 UTC
  workflow_dispatch:

# ↓↓↓ THIS IS THE IMPORTANT PART ↓↓↓
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate playlist (only working streams)
        run: python generate_playlist.py

      - name: Commit & push updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u8

          if git diff --staged --quiet; then
            echo "No changes in playlist"
          else
            git commit -m "chore: update playlist with working streams only [skip ci]"
            git push
          fi
